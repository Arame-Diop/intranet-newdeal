name: CI/CD - Dev Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: intranet-newdeal

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Lint & Validation
  # ─────────────────────────────────────────────
  lint:
    name: Lint et Validation HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Verification des fichiers HTML requis
        run: |
          echo "=== Verification des fichiers HTML ==="
          for f in index.html landing.html generic.html elements.html; do
            if [ -f "$f" ]; then
              echo "OK : $f present"
            else
              echo "ERREUR : $f manquant" && exit 1
            fi
          done

      - name: Verification du Dockerfile
        run: |
          echo "=== Validation Dockerfile ==="
          if grep -q "nginx:alpine3.23" Dockerfile; then
            echo "OK : image de base nginx:alpine3.23 correcte"
          else
            echo "ERREUR : image de base incorrecte" && exit 1
          fi

      - name: Verification du contenu MinComSN
        run: |
          echo "=== Verification du contenu ministerial ==="
          if grep -q "New Deal Technologique" index.html; then
            echo "OK : contenu New Deal Technologique present"
          else
            echo "ERREUR : contenu ministerial manquant" && exit 1
          fi

  # ─────────────────────────────────────────────
  # JOB 2 : Build Docker
  # ─────────────────────────────────────────────
  build:
    name: Build Docker Image (DEV)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Conversion du nom du repo en minuscules
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:dev-latest
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resume du build DEV
        run: |
          echo "## Build DEV termine" >> $GITHUB_STEP_SUMMARY
          echo "- Image : ${{ env.REGISTRY }}/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:dev-latest" >> $GITHUB_STEP_SUMMARY
          echo "- Commit : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branche : ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # JOB 3 : Tests fonctionnels
  # ─────────────────────────────────────────────
  test:
    name: Tests Fonctionnels (DEV)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Conversion du nom du repo en minuscules
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Demarrage du conteneur de test
        run: |
          docker pull ${{ env.REGISTRY }}/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:dev-latest
          docker run -d --name intranet-test -p 8080:80 \
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:dev-latest
          sleep 5

      - name: Test disponibilite HTTP
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          if [ "$STATUS" = "200" ]; then
            echo "OK : HTTP 200 - Intranet accessible"
          else
            echo "ERREUR : HTTP $STATUS" && exit 1
          fi

      - name: Test contenu New Deal Technologique
        run: |
          CONTENT=$(curl -s http://localhost:8080/)
          if echo "$CONTENT" | grep -q "New Deal Technologique"; then
            echo "OK : contenu MinComSN valide"
          else
            echo "ERREUR : contenu MinComSN absent" && exit 1
          fi

      - name: Nettoyage
        if: always()
        run: docker rm -f intranet-test 2>/dev/null || true

  # ─────────────────────────────────────────────
  # JOB 4 : Notification
  # ─────────────────────────────────────────────
  notify-dev:
    name: Notification DEV
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: always() && github.event_name == 'push'

    steps:
      - name: Bilan du pipeline DEV
        run: |
          echo "## Pipeline CI/CD DEV - MinComSN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Etape | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint  | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test  | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ministere de la Communication - New Deal Technologique" >> $GITHUB_STEP_SUMMARY
