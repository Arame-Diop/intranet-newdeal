name: CI/CD - Production Pipeline

on:
  push:
    branches:
      - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: intranet-newdeal

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Validation pre-production
  # ─────────────────────────────────────────────
  validate:
    name: Validation Pre-Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Verification stricte des fichiers
        run: |
          echo "=== Validation complete pour la PRODUCTION ==="
          ERRORS=0
          for f in index.html landing.html generic.html elements.html Dockerfile nginx.conf; do
            if [ -f "$f" ]; then
              echo "OK : $f"
            else
              echo "ERREUR : $f manquant"
              ERRORS=$((ERRORS+1))
            fi
          done
          [ $ERRORS -eq 0 ] || exit 1

      - name: Verification image nginx:alpine3.23
        run: |
          if grep -q "FROM nginx:alpine3.23" Dockerfile; then
            echo "OK : image de base nginx:alpine3.23 confirmee"
          else
            echo "ERREUR : image non conforme aux exigences de production" && exit 1
          fi

      - name: Verification du contenu ministerial
        run: |
          for keyword in "New Deal Technologique" "Ministere de la Communication" "Senegal"; do
            if grep -r "$keyword" index.html landing.html generic.html > /dev/null 2>&1; then
              echo "OK : '$keyword' present"
            else
              echo "ERREUR : '$keyword' manquant" && exit 1
            fi
          done

  # ─────────────────────────────────────────────
  # JOB 2 : Build de production
  # ─────────────────────────────────────────────
  build-prod:
    name: Build Docker Image (PROD)
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
      image_full: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Generation du tag de version
        id: version
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version de production : $TAG"

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push image de production
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resume du build PROD
        run: |
          echo "## Build PROD reussi" >> $GITHUB_STEP_SUMMARY
          echo "- Image : \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Version : \`${{ steps.version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit : \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # JOB 3 : Scan de securite (Trivy)
  # ─────────────────────────────────────────────
  security-scan:
    name: Scan Securite Trivy
    runs-on: ubuntu-latest
    needs: build-prod

    steps:
      - name: Scan Trivy sur l'image de production
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ needs.build-prod.outputs.image_full }}:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload des resultats SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ─────────────────────────────────────────────
  # JOB 4 : Tests de recette
  # ─────────────────────────────────────────────
  test-prod:
    name: Tests de Recette (PROD)
    runs-on: ubuntu-latest
    needs: build-prod

    steps:
      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Demarrage du conteneur de recette
        run: |
          docker pull ${{ needs.build-prod.outputs.image_full }}:latest
          docker run -d --name intranet-prod-test -p 8080:80 \
            ${{ needs.build-prod.outputs.image_full }}:latest
          sleep 5

      - name: Tests HTTP complets
        run: |
          for page in "" "landing.html" "generic.html"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/$page)
            if [ "$STATUS" = "200" ]; then
              echo "OK : GET /$page -> HTTP 200"
            else
              echo "ERREUR : GET /$page -> HTTP $STATUS" && exit 1
            fi
          done

      - name: Validation du contenu de production
        run: |
          CONTENT=$(curl -s http://localhost:8080/)
          for keyword in "New Deal Technologique" "Ministere de la Communication"; do
            if echo "$CONTENT" | grep -q "$keyword"; then
              echo "OK : '$keyword' present"
            else
              echo "ERREUR : '$keyword' absent" && exit 1
            fi
          done

      - name: Nettoyage
        if: always()
        run: docker rm -f intranet-prod-test 2>/dev/null || true

  # ─────────────────────────────────────────────
  # JOB 5 : Deploiement simule
  # ─────────────────────────────────────────────
  deploy-prod:
    name: Deploiement Production (Simule)
    runs-on: ubuntu-latest
    needs: [build-prod, security-scan, test-prod]

    steps:
      - name: Simulation du deploiement en production
        run: |
          echo "========================================================"
          echo "  DEPLOIEMENT PRODUCTION - Ministere de la Communication"
          echo "  New Deal Technologique - Intranet MinComSN"
          echo "========================================================"
          echo ""
          echo "  Image   : ${{ needs.build-prod.outputs.image_full }}:latest"
          echo "  Version : ${{ needs.build-prod.outputs.image_tag }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Acteur  : ${{ github.actor }}"
          echo "  Date    : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "[1/4] Connexion au serveur intranet.communication.gouv.sn ... OK"
          echo "[2/4] Pull de l'image nginx:alpine3.23 depuis GHCR .......... OK"
          echo "[3/4] Redemarrage du conteneur intranet-prod ................. OK"
          echo "[4/4] Verification de sante du conteneur ..................... OK"
          echo ""
          echo "========================================================"
          echo "  DEPLOIEMENT REUSSI"
          echo "  URL : http://intranet.communication.gouv.sn"
          echo "========================================================"

      - name: Resume du deploiement
        run: |
          echo "## Deploiement Production MinComSN OK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parametre | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.build-prod.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploye par | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Date | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | http://intranet.communication.gouv.sn |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # JOB 6 : Notification finale
  # ─────────────────────────────────────────────
  notify-prod:
    name: Notification Production
    runs-on: ubuntu-latest
    needs: [validate, build-prod, security-scan, test-prod, deploy-prod]
    if: always()

    steps:
      - name: Bilan du pipeline PROD
        run: |
          echo "## Pipeline CI/CD PROD - MinComSN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Etape       | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation  | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build PROD  | ${{ needs.build-prod.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Securite    | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests PROD  | ${{ needs.test-prod.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploiement | ${{ needs.deploy-prod.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ministere de la Communication - New Deal Technologique" >> $GITHUB_STEP_SUMMARY
