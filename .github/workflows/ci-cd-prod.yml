# ============================================================
# Pipeline CI/CD — Branche PROD
# Ministère de la Communication du Sénégal
# New Deal Technologique — Intranet MinComSN
# ============================================================
#
# Déclenchement : push sur 'prod' ou PR mergée depuis 'dev'
# Actions : build, scan sécurité, tests, push (tag: latest + version),
#           déploiement en production
# ============================================================

name: CI/CD — Production Pipeline

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod
    types:
      - closed

env:
  IMAGE_NAME: intranet-newdeal
  REGISTRY: ghcr.io
  CONTAINER_PORT: 80
  HOST_PORT: 80

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Validation pré-production
  # ─────────────────────────────────────────────
  validate:
    name: Validation Pré-Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Vérification stricte des fichiers
        run: |
          echo "=== Validation complète pour la PRODUCTION ==="
          ERRORS=0

          for f in index.html landing.html generic.html elements.html Dockerfile nginx.conf; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ $f MANQUANT"
              ERRORS=$((ERRORS+1))
            fi
          done

          if [ -d ".github/workflows" ]; then
            echo "✅ Dossier workflows présent"
          else
            echo "❌ Dossier workflows manquant"
            ERRORS=$((ERRORS+1))
          fi

          [ $ERRORS -eq 0 ] || exit 1

      - name: Vérification image de base nginx:alpine3.23
        run: |
          if grep -q "FROM nginx:alpine3.23" Dockerfile; then
            echo "✅ Image de base nginx:alpine3.23 confirmée"
          else
            echo "❌ Image de base non conforme aux exigences de production"
            exit 1
          fi

      - name: Vérification du contenu ministerial
        run: |
          CHECKS=(
            "New Deal Technologique"
            "Ministère de la Communication"
            "Sénégal"
            "communication.gouv.sn"
          )
          for check in "${CHECKS[@]}"; do
            if grep -r "$check" index.html landing.html generic.html > /dev/null 2>&1; then
              echo "✅ Contenu vérifié : '$check'"
            else
              echo "❌ Contenu manquant : '$check'"
              exit 1
            fi
          done

  # ─────────────────────────────────────────────
  # JOB 2 : Build de production
  # ─────────────────────────────────────────────
  build-prod:
    name: Build Docker Image (PROD)
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
      image_full: ${{ steps.version.outputs.full }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Génération du tag de version
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)"
          FULL_IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "full=$FULL_IMAGE" >> $GITHUB_OUTPUT
          echo "Version de production : $VERSION"

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraction des métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.tag }}
            type=sha,prefix=prod-

      - name: Build et push image de production
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_ENV=production
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}

      - name: Résumé du build PROD
        run: |
          echo "## Build PROD réussi 🏭" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ steps.version.outputs.full }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`${{ steps.version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # JOB 3 : Scan de sécurité (Trivy)
  # ─────────────────────────────────────────────
  security-scan:
    name: Scan Sécurité de l'Image
    runs-on: ubuntu-latest
    needs: build-prod

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Trivy — Vulnérabilités critiques
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ needs.build-prod.outputs.image_full }}:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # Ne bloque pas, mais signale

      - name: Upload des résultats de sécurité
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Rapport de sécurité simplifié
        run: |
          echo "## Scan Sécurité Trivy 🔒" >> $GITHUB_STEP_SUMMARY
          echo "Image analysée : \`${{ needs.build-prod.outputs.image_full }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "Résultats disponibles dans l'onglet Security > Code scanning." >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # JOB 4 : Tests de recette production
  # ─────────────────────────────────────────────
  test-prod:
    name: Tests de Recette (PROD)
    runs-on: ubuntu-latest
    needs: build-prod

    steps:
      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Démarrage du conteneur de recette
        run: |
          docker pull ${{ needs.build-prod.outputs.image_full }}:latest
          docker run -d \
            --name intranet-prod-test \
            -p 8080:80 \
            --health-cmd="wget -q --spider http://localhost/ || exit 1" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=3 \
            ${{ needs.build-prod.outputs.image_full }}:latest
          echo "Attente de l'initialisation du conteneur..."
          sleep 10

      - name: Tests HTTP complets
        run: |
          echo "=== Tests de recette production ==="

          # Test page principale
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          [ "$STATUS" = "200" ] && echo "✅ GET / → HTTP 200" || (echo "❌ GET / → HTTP $STATUS" && exit 1)

          # Test landing page
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/landing.html)
          [ "$STATUS" = "200" ] && echo "✅ GET /landing.html → HTTP 200" || (echo "❌ GET /landing.html → HTTP $STATUS" && exit 1)

          # Test generic page
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/generic.html)
          [ "$STATUS" = "200" ] && echo "✅ GET /generic.html → HTTP 200" || (echo "❌ GET /generic.html → HTTP $STATUS" && exit 1)

          # Test des assets
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/assets/css/main.css)
          [ "$STATUS" = "200" ] && echo "✅ GET /assets/css/main.css → HTTP 200" || echo "⚠️  GET /assets/css/main.css → HTTP $STATUS"

      - name: Validation du contenu de production
        run: |
          CONTENT=$(curl -s http://localhost:8080/)
          CHECKS=(
            "New Deal Technologique"
            "Ministère de la Communication"
            "communication.gouv.sn"
          )
          for check in "${CHECKS[@]}"; do
            if echo "$CONTENT" | grep -q "$check"; then
              echo "✅ Contenu présent : '$check'"
            else
              echo "❌ Contenu absent : '$check'" && exit 1
            fi
          done

      - name: Test des headers de sécurité
        run: |
          echo "=== Vérification des headers de sécurité ==="
          HEADERS=$(curl -s -I http://localhost:8080/)
          for header in "X-Frame-Options" "X-Content-Type-Options" "X-XSS-Protection"; do
            if echo "$HEADERS" | grep -qi "$header"; then
              echo "✅ Header présent : $header"
            else
              echo "⚠️  Header absent : $header"
            fi
          done

      - name: Nettoyage
        if: always()
        run: docker rm -f intranet-prod-test 2>/dev/null || true

  # ─────────────────────────────────────────────
  # JOB 5 : Déploiement en Production
  # ─────────────────────────────────────────────
  deploy-prod:
    name: Déploiement Production
    runs-on: ubuntu-latest
    needs: [build-prod, security-scan, test-prod]
    environment:
      name: production
      url: http://intranet.communication.gouv.sn

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Déploiement via SSH sur le serveur de production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || 22 }}
          script: |
            set -e
            echo "=== Déploiement Intranet MinComSN — Production ==="
            echo "Version : ${{ needs.build-prod.outputs.image_tag }}"

            # Authentification au registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            # Pull de la nouvelle image
            docker pull ${{ needs.build-prod.outputs.image_full }}:latest

            # Arrêt propre du conteneur existant
            docker stop intranet-prod 2>/dev/null || true
            docker rm   intranet-prod 2>/dev/null || true

            # Démarrage du nouveau conteneur
            docker run -d \
              --name intranet-prod \
              --restart unless-stopped \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.intranet.rule=Host(\`intranet.communication.gouv.sn\`)" \
              ${{ needs.build-prod.outputs.image_full }}:latest

            # Vérification post-déploiement
            sleep 10
            docker ps | grep intranet-prod && echo "✅ Conteneur démarré avec succès"

            # Nettoyage des anciennes images
            docker image prune -f

      - name: Résumé du déploiement
        run: |
          echo "## Déploiement Production MinComSN ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Paramètre | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.build-prod.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Déployé par | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Heure | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | http://intranet.communication.gouv.sn |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ministère de la Communication — New Deal Technologique**" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # JOB 6 : Notification finale
  # ─────────────────────────────────────────────
  notify-prod:
    name: Notification Production
    runs-on: ubuntu-latest
    needs: [validate, build-prod, security-scan, test-prod, deploy-prod]
    if: always()

    steps:
      - name: Bilan du pipeline PROD
        run: |
          echo "## Pipeline CI/CD PROD — MinComSN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Étape | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build PROD | ${{ needs.build-prod.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sécurité   | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests PROD | ${{ needs.test-prod.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Déploiement| ${{ needs.deploy-prod.result }} |" >> $GITHUB_STEP_SUMMARY
